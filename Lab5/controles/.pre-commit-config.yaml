# Ganchos pre-commit propuestos para los repositorios de SmartPot (instalar con `pre-commit install`).
# Cubren secretos, lint por lenguaje, las reglas Semgrep del Lab5 y un SCA rápido de Snyk solo en el push.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks            # secretos antes de que lleguen al historial (caso del token de Telegram en SmartPot-IoT)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1024"]  # evita volcar digest.txt o dumps con datos

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff                # F821 habría marcado el `sys` que faltaba en stress_ingestion_query.py

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker

  - repo: local
    hooks:
      - id: semgrep-smartpot
        name: Semgrep · reglas SmartPot (V1-V3)
        entry: semgrep --config controles/semgrep/smartpot-appsec.yml --error --metrics=off
        language: system
        types_or: [python, java, dockerfile]
        pass_filenames: true

      - id: gofmt
        name: gofmt
        entry: bash -c 'test -z "$(gofmt -l .)"'
        language: system
        files: \.go$
        pass_filenames: false

      - id: snyk-sca-push
        name: Snyk Open Source (solo en push, umbral alto)
        entry: snyk test --severity-threshold=high
        language: system
        stages: [pre-push]
        pass_filenames: false
